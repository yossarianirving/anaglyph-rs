[package]
name = "anaglyph-rs"
version = "0.1.0"
edition = "2021"
description = "Convert stereo image pairs, gifs and videos into red/cyan anaglyphs"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "bench_encode"
required-features = ["video"]

[[example]]
name = "bench_gif"
required-features = ["gpu"]

[[example]]
name = "bench_stages"
required-features = ["video"]

[dependencies]
clap = { version = "4.5.4", features = ["derive", "cargo"] }
image = { version = "0.25.5", features = ["gif"] }
video-rs = { version = "0.12", features = ["ndarray"], optional = true }
ndarray = { version = "0.17", optional = true }
rayon = { version = "1.10.0", optional = true}
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }
futures-channel = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }

[features]
# GPU blending for images, gifs and video via wgpu. Standalone: unlike
# `video` it has no ffmpeg dependency, so it also builds for wasm32
# (browser WebGPU).
gpu = ["dep:wgpu", "dep:pollster", "dep:futures-channel"]
# Parallel CPU blending fallback (rayon); the wasm target has no threads
# here, so the fallback there stays single-threaded.
parallel = ["dep:rayon"]
video = ["dep:video-rs", "dep:ndarray", "parallel", "gpu"]
# wasm-bindgen entry points for the browser; implies `gpu`.
wasm = ["gpu", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]